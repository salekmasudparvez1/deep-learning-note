<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">YOLO Architecture – Main Parts</text>

  <!-- Input -->
  <rect x="15" y="150" width="105" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="67" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">INPUT</text>
  <rect x="35" y="195" width="65" height="65" fill="#bfdbfe" stroke="#2563eb"/>
  <path d="M35,260 L55,235 L70,250 L82,238 L100,260 Z" fill="#60a5fa"/>
  <circle cx="85" cy="212" r="7" fill="#fde047"/>
  <rect x="48" y="226" width="30" height="30" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="67" y="290" text-anchor="middle" font-size="12" fill="#334155">Image</text>
  <text x="67" y="306" text-anchor="middle" font-size="12" fill="#334155">640×640×3</text>

  <!-- Backbone -->
  <rect x="150" y="55" width="190" height="355" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">BACKBONE</text>
  <text x="245" y="97" text-anchor="middle" font-size="11" fill="#334155">Feature extractor (CSPDarknet)</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="170" y="110" width="150" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="245" y="134">Stem Conv</text>
    <rect x="170" y="170" width="150" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="245" y="194">Conv + C2f (stride 4)</text>
    <rect x="170" y="230" width="150" height="38" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="245" y="254">P3 · stride 8</text>
    <rect x="170" y="290" width="150" height="38" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="245" y="314">P4 · stride 16</text>
    <rect x="170" y="350" width="150" height="38" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="245" y="374">P5 · stride 32 + SPPF</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#a)">
    <line x1="245" y1="148" x2="245" y2="168"/>
    <line x1="245" y1="208" x2="245" y2="228"/>
    <line x1="245" y1="268" x2="245" y2="288"/>
    <line x1="245" y1="328" x2="245" y2="348"/>
  </g>
  <line x1="120" y1="240" x2="148" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Neck -->
  <rect x="375" y="55" width="190" height="355" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">NECK</text>
  <text x="470" y="97" text-anchor="middle" font-size="11" fill="#334155">Feature fusion (FPN + PAN)</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="395" y="230" width="110" height="38" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="450" y="254">N3 (small)</text>
    <rect x="395" y="290" width="110" height="38" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="450" y="314">N4 (medium)</text>
    <rect x="395" y="350" width="110" height="38" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="450" y="374">N5 (large)</text>
  </g>
  <!-- backbone to neck -->
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#a)">
    <line x1="320" y1="249" x2="393" y2="249"/>
    <line x1="320" y1="309" x2="393" y2="309"/>
    <line x1="320" y1="369" x2="393" y2="369"/>
  </g>
  <!-- top-down (upsample) -->
  <g stroke="#16a34a" stroke-width="2" marker-end="url(#a)">
    <line x1="415" y1="350" x2="415" y2="330"/>
    <line x1="415" y1="290" x2="415" y2="270"/>
  </g>
  <!-- bottom-up (PAN) -->
  <g stroke="#ea580c" stroke-width="2" marker-end="url(#a)">
    <line x1="487" y1="268" x2="487" y2="288"/>
    <line x1="487" y1="328" x2="487" y2="348"/>
  </g>
  <text x="470" y="130" text-anchor="middle" font-size="11" fill="#16a34a">↑ Top-down: upsample + concat</text>
  <text x="470" y="150" text-anchor="middle" font-size="11" fill="#ea580c">↓ Bottom-up: downsample + concat</text>
  <text x="470" y="185" text-anchor="middle" font-size="11" fill="#334155">Mixes low-level detail</text>
  <text x="470" y="200" text-anchor="middle" font-size="11" fill="#334155">with high-level meaning</text>

  <!-- Head -->
  <rect x="595" y="55" width="150" height="355" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="670" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">HEAD</text>
  <text x="670" y="97" text-anchor="middle" font-size="11" fill="#334155">Detection layers</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="610" y="225" width="120" height="48" rx="6" fill="#fed7aa" stroke="#ea580c"/>
    <text x="670" y="245">Head 80×80</text><text x="670" y="262" font-size="10">small objects</text>
    <rect x="610" y="285" width="120" height="48" rx="6" fill="#fed7aa" stroke="#ea580c"/>
    <text x="670" y="305">Head 40×40</text><text x="670" y="322" font-size="10">medium objects</text>
    <rect x="610" y="345" width="120" height="48" rx="6" fill="#fed7aa" stroke="#ea580c"/>
    <text x="670" y="365">Head 20×20</text><text x="670" y="382" font-size="10">large objects</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#a)">
    <line x1="505" y1="249" x2="608" y2="249"/>
    <line x1="505" y1="309" x2="608" y2="309"/>
    <line x1="505" y1="369" x2="608" y2="369"/>
  </g>
  <!-- grid illustration -->
  <g stroke="#ea580c" stroke-width="0.8" fill="none">
    <rect x="640" y="115" width="60" height="60"/>
    <line x1="660" y1="115" x2="660" y2="175"/><line x1="680" y1="115" x2="680" y2="175"/>
    <line x1="640" y1="135" x2="700" y2="135"/><line x1="640" y1="155" x2="700" y2="155"/>
  </g>
  <rect x="662" y="137" width="16" height="16" fill="#ea580c" opacity="0.5"/>
  <text x="670" y="195" text-anchor="middle" font-size="10" fill="#334155">S×S grid cells</text>

  <!-- Output -->
  <rect x="765" y="150" width="125" height="180" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="827" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e22ce">OUTPUT</text>
  <g font-size="11" fill="#0f172a" text-anchor="middle">
    <rect x="778" y="188" width="99" height="26" rx="5" fill="#e9d5ff"/><text x="827" y="205">Box (x, y, w, h)</text>
    <rect x="778" y="220" width="99" height="26" rx="5" fill="#e9d5ff"/><text x="827" y="237">Objectness</text>
    <rect x="778" y="252" width="99" height="26" rx="5" fill="#e9d5ff"/><text x="827" y="269">Class scores</text>
  </g>
  <rect x="778" y="290" width="99" height="30" rx="5" fill="#9333ea"/>
  <text x="827" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">NMS filter</text>
  <line x1="730" y1="309" x2="763" y2="309" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Legend -->
  <text x="450" y="440" text-anchor="middle" font-size="12" fill="#334155">Image → Backbone (extract features) → Neck (merge scales) → Head (predict boxes + classes) → NMS (remove duplicates)</text>
</svg>
